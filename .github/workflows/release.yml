# Yeni sürüm yayınlanınca (Releases -> Publish) Windows kurulum dosyasını derleyip sürüme ekler.
name: Windows sürümü derle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Deneme derlemesi için sürüm (ör. 0.3.0)"
        required: true
        default: "0.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Sürüm numarasını ayarla
        shell: pwsh
        run: |
          $v = "${{ github.event.release.tag_name || inputs.version }}".TrimStart("v")
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Get-Content promptvideo/__init__.py) -replace '__version__ = ".*"', "__version__ = `"$v`"" |
            Set-Content promptvideo/__init__.py -Encoding utf8

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Uygulamayı paketle (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean PromptVideo.spec

      - name: Duman testi (2 sahnelik deneme videosu)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PromptVideo\PromptVideo.exe -ArgumentList "--selftest","selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path selftest\video.mp4)) { Write-Error "Deneme videosu üretilemedi"; exit 1 }

      - name: Kurulum dosyası (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$env:VERSION" kurulum.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Kurulum dosyasını sürüme ekle
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Output/PromptVideo-${{ env.VERSION }}-Kurulum.exe

      - name: Deneme derlemesini sakla
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: PromptVideo-${{ env.VERSION }}-Kurulum
          path: Output/*.exe
